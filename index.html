<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        /* ===== UNVERÄNDERT ===== */
        :root {
            --bg-dark: #0a0e27;
            --bg-card: #141b3a;
            --accent-danger: #ff3366;
            --accent-warning: #ffaa00;
            --accent-success: #00ff88;
            --accent-info: #00d4ff;
            --text-primary: #e8edf4;
            --text-secondary: #8b95b0;
            --shadow-glow: 0 0 40px rgba(255, 51, 102, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 170, 0, 0.05) 0%, transparent 70%);
            animation: bgPulse 15s ease-in-out infinite;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes bgPulse { 0%,100%{opacity:1} 50%{opacity:.6} }

        .container { max-width: 900px; margin: auto; padding: 2rem; }

        .warning-screen,
        .results-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .quiz-screen { display: none; padding: 2rem 0; }

        .warning-card,
        .question-card,
        .results-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .option { cursor: pointer; }
        .option.disabled { cursor: not-allowed; opacity: .6; }
        .option.correct { border-color: var(--accent-success); }
        .option.incorrect { border-color: var(--accent-danger); }

        video { background: black; }
    </style>
</head>

<body>

<div class="warning-screen" id="warningScreen">
    <div class="container">
        <div class="warning-card">
            <h1>⚠️ Stopp!</h1>
            <p>Das hätte ein Phishing-Link sein können!</p>
            <button onclick="startQuiz()">Quiz starten</button>
        </div>
    </div>
</div>

<div class="quiz-screen" id="quizScreen">
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="questionContainer"></div>
    </div>
</div>

<div class="results-screen" id="resultsScreen">
    <div class="container">
        <div class="results-card">
            <h2>Quiz abgeschlossen!</h2>
            <div id="finalScore"></div>
            <button onclick="location.reload()">Neu starten</button>
        </div>
    </div>
</div>

<script>
const questions = [
    {
        question: "Ist dies ein Deepfake?",
        type: "video",
        videoUrl: "videos/deepfake_video_1.mp4",
        options: ["Nein", "Ja", "Unsicher"],
        correct: 1,
        explanation: "Achte auf Augen und Mund."
    },
    {
        question: "Ist dies ein Deepfake?",
        type: "video",
        videoUrl: "videos/deepfake_video_2.mp4",
        options: ["Nein", "Ja", "Unsicher"],
        correct: 1,
        explanation: "Quelle prüfen."
    }
];

let currentQuestion = 0;
let score = 0;

function startQuiz() {
    warningScreen.style.display = "none";
    quizScreen.style.display = "block";
    loadQuestion();
}

/* ===== HIER IST DIE EINZIGE RELEVANTE ÄNDERUNG ===== */
function loadQuestion() {
    if (currentQuestion >= questions.length) {
        showResults();
        return;
    }

    const q = questions[currentQuestion];
    progressFill.style.width = (currentQuestion / questions.length) * 100 + "%";

    const mediaHTML = q.type === "video"
        ? `<video controls preload="metadata" style="width:100%;border-radius:12px;margin:1rem 0;">
               <source src="${q.videoUrl}" type="video/mp4">
           </video>`
        : "";

    questionContainer.innerHTML = `
        <div class="question-card">
            <h3>${q.question}</h3>
            ${mediaHTML}
            <div>
                ${q.options.map((o,i)=>`<div class="option" onclick="selectAnswer(${i})">${o}</div>`).join("")}
            </div>
            <p id="explanation" style="display:none">${q.explanation}</p>
            <button id="nextBtn" style="display:none" onclick="nextQuestion()">Weiter</button>
        </div>
    `;
}

function selectAnswer(i) {
    const q = questions[currentQuestion];
    document.getElementById("explanation").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
    if (i === q.correct) score++;
}

function nextQuestion() {
    currentQuestion++;
    loadQuestion();
}

function showResults() {
    quizScreen.style.display = "none";
    resultsScreen.style.display = "flex";
    finalScore.textContent = `${score}/${questions.length}`;
}
</script>

</body>
</html>
